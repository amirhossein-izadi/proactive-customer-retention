[project]
name = "didar-retention"
version = "0.1.0"
description = "Customer retention uplift modeling — causal ML for churn reduction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "catboost>=1.2",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "mlflow>=2.17",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    "shap>=0.46",
    "dvc>=3.57",
    "pandera>=0.32.1",
    "tqdm>=4.69.0",
    "optuna>=4.9.0",
    "imbalanced-learn>=0.14.2",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.119",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]
automl = ["autogluon>=1.2"]
tabfm = ["torch>=2.5", "transformers>=4.47"]
monitoring = [
    "opentelemetry-sdk>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
]
notebooks = [
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]
explainability = [
    "lime>=0.2",
]

[project.scripts]
retention = "retention.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retention"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
